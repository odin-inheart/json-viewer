<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viewer JSON </title>

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">
  <nav id="main-navbar" class="navbar navbar-light bg-white shadow-sm mb-3">
    <div class="container">
      <button id="toggle-theme-btn" class="btn btn-sm btn-outline-secondary">
        Toggle theme
      </button>

      <span class="navbar-brand mb-0 h1">JSON Viewer / Editor</span>
      <span class="text-muted small">
        Projet Stage DWWM
      </span>
    </div>
  </nav>

  <main class="container mb-4">
    <section class="mb-3">
      <div class="d-flex flex-wrap gap-2 align-items-center">

        <!-- ===LOAD/SAVE/DOWNLOAD BUTTONS=== -->
        <div class="btn-group btn-group-sm" role="group" aria-label="Server actions">
          <button id="load-from-server" class="btn btn-primary btn-sm">Load JSON from server
          </button>

          <button id="save-to-server" class="btn btn-success btn-sm">
            Save JSON to server
          </button>

          <button id="download-json" class="btn btn-outline-light">
            <i class="bi bi-download"></i>
            Download JSON
          </button>
        </div>
        <!-- ===FILE INPUT=== -->
        <div class="d-flex flex-wrap align-items-center gap-2">
          <label for="json-file-input" class="form-label mb-0 small">
            local JSON:
          </label>

          <input type="file" id="json-file-input" class="form-control form-control-sm" accept=".json,application/json"
            style="max-width: 260px;" />
        </div>

        <!-- status msg -->
        <div class="ms-auto small text-muted" id="message"></div>
      </div>
    </section>


    <section class="mt-4">

      <!-- title + view switch -->
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h6 mb-0">Table view</h2>

        <div class="d-flex align-items-center gap-2">
          <div class="d-none">
            <button id="apply-row-edit" type="button" class="btn btn-sm btn-primary">
              Apply selected row to JSON
            </button>
            <button id="cancel-row-edit" type="button" class="btn btn-sm btn-outline-secondary">
              Cancel row editing
            </button>
          </div>

          <!-- Switch table/raw view -->
          <div class="btn-group btn-group-sm" role="group" id="view-toggle">
            <button type="button" class="btn btn-outline-secondary active" data-view="table">
              Table view
            </button>
            <button type="button" class="btn btn-outline-secondary" data-view="raw">
              Raw JSON view
            </button>
          </div>
        </div>
      </div>

      <!-- filters -->
      <div class="mb-2 d-flex flex-wrap align-items-center gap-2">
        <select id="table-section-select" class="form-select form-select-sm w-auto" style="min-width: 220px;"></select>

        <select id="table-key-select" class="form-select form-select-sm w-auto" style="min-width: 180px;"></select>

        <input id="table-filter-input" class="form-control form-control-sm w-auto" placeholder="Filter text..." />

        <button id="raw-find-next" class="btn btn-sm btn-outline-primary">Next</button>
        <button id="raw-find-prev" class="btn btn-sm btn-outline-primary">Previous</button>


        <button id="refresh-table" class="btn btn-sm btn-outline-secondary">
          Reset
        </button>
      </div>

      <!-- table view -->
      <div id="table-view-wrapper">
        <div class="table-responsive small" id="table-container">
          <p class="text-muted mb-0">
            No data available.
          </p>
        </div>
      </div>

      <!-- raw view -->
      <div id="raw-view-wrapper" class="mt-3 d-none">
        <label for="json-editor" class="form-label">Raw JSON editor</label>
        <textarea id="json-editor" class="form-control" rows="18" spellcheck="false"></textarea>
      </div>
    </section>
  </main>





  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script type="module" src="/js/main.js"></script>

</body>

</html>
